spring:
  data:
    mongodb:
      uri: mongodb://mongodb:27017
      database: fitnessrecommendations

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

server:
  port: 8083

groq:
  api:
    url: https://api.groq.com/openai/v1
    key: ${GROQ_API_KEY}

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:8761/eureka/

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking
