services:

  # ── User Service ───────────────────────────────────────────────────────────
  - type: web
    name: fitness-userservice
    runtime: docker
    dockerfilePath: ./userservice/Dockerfile
    dockerContext: ./userservice
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

  # ── Activity Service ───────────────────────────────────────────────────────
  - type: web
    name: fitness-acticityservice
    runtime: docker
    dockerfilePath: ./acticityservice/Dockerfile
    dockerContext: ./acticityservice
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: MONGODB_URI
        sync: false
      - key: RABBITMQ_URL
        sync: false

  # ── AI Service ─────────────────────────────────────────────────────────────
  - type: web
    name: fitness-aiservice
    runtime: docker
    dockerfilePath: ./aiservice/Dockerfile
    dockerContext: ./aiservice
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: MONGODB_URI
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ── Gateway ────────────────────────────────────────────────────────────────
  - type: web
    name: fitness-gateway
    runtime: docker
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: ./gateway
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: USER_SERVICE_URL
        value: https://fitness-userservice.onrender.com
      - key: ACTIVITY_SERVICE_URL
        value: https://fitness-acticityservice.onrender.com
      - key: AI_SERVICE_URL
        value: https://fitness-aiservice.onrender.com
      - key: KEYCLOAK_ISSUER_URI
        sync: false
      - key: KEYCLOAK_JWK_URI
        sync: false

  # ── Frontend ───────────────────────────────────────────────────────────────
  - type: web
    name: fitness-frontend
    runtime: docker
    dockerfilePath: ./fitness-app-frontend/Dockerfile
    dockerContext: ./fitness-app-frontend
    plan: free
