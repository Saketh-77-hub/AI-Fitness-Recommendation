server:
  port: ${PORT:8080}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://dev-ooryx7evb8kbyq1z.us.auth0.com/}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:https://dev-ooryx7evb8kbyq1z.us.auth0.com/.well-known/jwks.json}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/api/users/**

            - id: activity-service
              uri: ${ACTIVITY_SERVICE_URL}
              predicates:
                - Path=/api/activities/**

            - id: ai-service
              uri: ${AI_SERVICE_URL}
              predicates:
                - Path=/api/recommendations/**

eureka:
  client:
    enabled: false
