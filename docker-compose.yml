services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: fitness_user_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8181:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/master || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Spring Cloud Infrastructure ───────────────────────────────────────────

  eureka:
    build: ./eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  configserver:
    build: ./configserver
    ports:
      - "8888:8888"
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Microservices ─────────────────────────────────────────────────────────

  userservice:
    build: ./userservice
    ports:
      - "8081:8081"
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      configserver:
        condition: service_healthy

  acticityservice:
    build: ./acticityservice
    ports:
      - "8082:8082"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      configserver:
        condition: service_healthy

  aiservice:
    build: ./aiservice
    ports:
      - "8083:8083"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      configserver:
        condition: service_healthy

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      configserver:
        condition: service_healthy
      userservice:
        condition: service_started
      acticityservice:
        condition: service_started
      aiservice:
        condition: service_started

  # ── Frontend ──────────────────────────────────────────────────────────────

  frontend:
    build: ./fitness-app-frontend
    ports:
      - "80:80"
    depends_on:
      - gateway

volumes:
  postgres_data:
  mongo_data:
